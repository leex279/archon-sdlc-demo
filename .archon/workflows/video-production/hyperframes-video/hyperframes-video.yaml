name: hyperframes-video
description: |
  Produce one HyperFrames video in the diy-yt-creator-hyperframes repository:
  grounded planning (brief, script, storyboard, kinetic visual plan), a single
  human approval before paid Thomas narration, narration generated exactly once
  and hash-locked, a bounded build -> draft render -> deterministic gates ->
  independent visual review loop, a final render, and a verified MP4 plus QA
  receipts. Authored success (`succeeded`) is recorded separately from run
  lifecycle completion.

  Use when: "produce video <slug>", "build the hyperframes video for <slug>",
  "run video production for <slug>", or resuming a half-built video with
  `accept_existing=true`. Run from the diy-yt-creator-hyperframes repo root.
  NOT for: publishing to YouTube, catalog linking, speed-ups of shipped MP4s,
  or maintenance re-renders of already-published videos.

interactive: true
# Workflow default (Sonnet 5) covers the build node; judgment nodes
# (plan-video, review-video) pin Fable 5.1 per node. Literal refs pass
# through to the Claude CLI unchanged.
model: sonnet
worktree:
  enabled: false   # narration, transcript, MP4 belong on the working branch, not a worktree

inputs:
  slug:
    required: true
    description: Lowercase hyphenated video slug; the project lives at videos/<slug>/.
  brief:
    default: ""
    description: Operator intent (topic, angle, sources, constraints) reconciled into videos/<slug>/BRIEF.md.
  format:
    default: long-form
    description: long-form (1920x1080) or shorts (1080x1920). Selects the TTS mode and the safe-zone rules.
  accept_existing:
    default: "false"
    description: Set to true to adopt existing narration/transcript as locked inputs instead of failing on them.

returns: verify-and-report
outcome_field: succeeded

nodes:
  # Planning repeats until the operator approves. The gate sits at the END of
  # the group so a "needs revision" answer feeds the next planning pass and a
  # third refusal fails the run truthfully instead of blessing a stale plan.
  - id: planning
    loop_group:
      max_iterations: 3
      until_bash: test $approve-plan.output.decision = "approve"
      nodes:
        - id: plan-video
          model: fable
          command: plan-video
          with:
            slug: "$INPUTS.slug"
            brief: "$INPUTS.brief"
            format: "$INPUTS.format"
            accept_existing: "$INPUTS.accept_existing"
            revision_feedback: "$LOOP_PREV.approve-plan.output.text"
            preflight_problems: "$LOOP_PREV.preflight.output.problems"
          output_type: hyperframes-video-plan
          output_format:
            type: object
            properties:
              ready: { type: boolean }
              script_path: { type: string }
              kinetic_plan_path: { type: string }
              summary: { type: string }
            required: [ready, script_path, kinetic_plan_path, summary]

        # Pre-TTS money gate. Runs the repository's own hook-enforced checks
        # (workslop / voice laws, retention artifact, AI disclosure) so a
        # script that Claude Code's PreToolUse hook would block never reaches
        # ElevenLabs from inside this run either.
        - id: preflight
          script: preflight
          runtime: uv
          depends_on: [plan-video]
          with:
            slug: "$INPUTS.slug"
            plan_ready: "$plan-video.output.ready"

        - id: approve-plan
          depends_on: [preflight]
          when: "$preflight.output.green == true"
          approval:
            message: >-
              Approve the script at $plan-video.output.script_path and the
              kinetic plan at $plan-video.output.kinetic_plan_path.
              Approval spends money on Thomas TTS; the narration is then
              hash-locked and never regenerated by this run. Choose
              "Needs revision" and write what must change to loop planning.
            decisions:
              - { id: approve, label: Approve and generate narration }
              - { id: needs-revision, label: Needs revision }

  # Paid narration is a deterministic act, not an AI decision: generated once,
  # only when missing, receipt written with the SHA-256 that every later gate
  # compares against.
  - id: narration
    script: generate-narration
    runtime: uv
    timeout: 1200000
    depends_on: [planning]
    # Money gate: `planning` only completes when approve-plan answered
    # "approve" (until_bash); a red preflight skips the gate, the loop retries
    # with the problems, then FAILS the run after max_iterations. Nothing
    # below runs without an explicit approve.
    with:
      slug: "$INPUTS.slug"
      format: "$INPUTS.format"
      accept_existing: "$INPUTS.accept_existing"

  - id: production
    depends_on: [narration]
    loop_group:
      max_iterations: 4
      until_bash: test $validate-video.output.green = "true" && test $review-video.output.ready = "true"
      nodes:
        - id: produce-video
          command: produce-video
          with:
            slug: "$INPUTS.slug"
            format: "$INPUTS.format"
            narration_sha256: "$narration.output.narration_sha256"
            previous_validation: "$LOOP_PREV.validate-video.output"
            previous_review: "$LOOP_PREV.review-video.output"
          output_type: hyperframes-production-iteration
          output_format:
            type: object
            properties:
              complete: { type: boolean }
              summary: { type: string }
            required: [complete, summary]

        - id: render-draft
          script: render-video
          runtime: uv
          timeout: 1800000
          depends_on: [produce-video]
          with:
            slug: "$INPUTS.slug"
            mode: draft
            narration_sha256: "$narration.output.narration_sha256"

        - id: contact-sheet
          script: contact-sheet
          runtime: uv
          timeout: 300000
          depends_on: [render-draft]
          with:
            slug: "$INPUTS.slug"
            render_path: "$render-draft.output.render_path"

        - id: validate-video
          script: validate-video
          runtime: uv
          timeout: 900000
          depends_on: [contact-sheet]
          with:
            slug: "$INPUTS.slug"
            narration_sha256: "$narration.output.narration_sha256"
            render_path: "$render-draft.output.render_path"

        # Independent judge: fresh session, reads only the decoded evidence.
        - id: review-video
          model: fable
          command: review-video
          context: fresh
          depends_on: [validate-video]
          with:
            slug: "$INPUTS.slug"
            format: "$INPUTS.format"
            narration_sha256: "$narration.output.narration_sha256"
            render_path: "$render-draft.output.render_path"
            contact_sheets: "$contact-sheet.output.sheets"
            validation: "$validate-video.output"
          output_type: hyperframes-independent-review
          output_format:
            type: object
            properties:
              ready: { type: boolean }
              receipt_path: { type: string }
              blocking_findings:
                type: array
                items: { type: string }
              summary: { type: string }
            required: [ready, receipt_path, blocking_findings, summary]

  - id: final-render
    script: render-video
    runtime: uv
    timeout: 1800000
    depends_on: [production]
    with:
      slug: "$INPUTS.slug"
      mode: final
      narration_sha256: "$narration.output.narration_sha256"

  # Terminal verdict from artifacts on disk. A red verdict FAILS the run
  # (exit 1) so lifecycle status can never claim a video that does not exist;
  # the reasons live in $ARTIFACTS_DIR/final-artifact-report.json.
  - id: verify-and-report
    script: report-artifacts
    runtime: uv
    depends_on: [final-render]
    with:
      slug: "$INPUTS.slug"
      narration_sha256: "$narration.output.narration_sha256"
      render_path: "$final-render.output.render_path"
    output_format:
      type: object
      properties:
        succeeded: { type: boolean }
        mp4_path: { type: string }
        summary: { type: string }
      required: [succeeded, mp4_path, summary]

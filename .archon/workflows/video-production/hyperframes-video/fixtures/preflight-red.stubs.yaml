# Dry-run fixture: preflight red. The approval gate is guarded by
# `when: $preflight.output.green == true`, so a red preflight SKIPS the gate —
# the operator is never asked to approve a planning set a machine check refused.
# In a real run `until_bash` then fails, the loop retries plan-video with the
# preflight problems, and the run FAILS after max_iterations without spending
# on TTS. The simulator does not evaluate until_bash, so downstream nodes are
# stubbed here; the assertion this fixture carries is the skipped gate.
plan-video:
  ready: true
  script_path: videos/demo-video/script.txt
  kinetic_plan_path: videos/demo-video/kinetic-visual-plan.md
  summary: "stub: planning set complete"
preflight: '{"green":false,"slug":"demo-video","problems":["scripts/check-workslop.py exited 2"],"summary":"stub: preflight red"}'
narration: '{"narration_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","origin":"generated this run","summary":"stub"}'
produce-video:
  complete: true
  summary: "stub: composition built"
render-draft: '{"complete":true,"narration_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","render_path":"out/demo-video.mp4","summary":"stub"}'
contact-sheet: '{"sheets":["/fixture/qa/contact-sheet-demo-video-full.jpg"],"frames":[],"duration":120.0}'
validate-video: '{"green":true,"narration_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","receipt_path":"/fixture/validation-receipt.json","failed_gates":[],"summary":"stub"}'
review-video:
  ready: true
  receipt_path: /fixture/independent-review-receipt.json
  blocking_findings: []
  summary: "stub: no blocking findings"
final-render: '{"complete":true,"narration_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","render_path":"out/demo-video.mp4","summary":"stub"}'
verify-and-report: '{"succeeded":true,"mp4_path":"out/demo-video.mp4","validation_receipt":"/fixture/validation-receipt.json","review_receipt":"/fixture/independent-review-receipt.json","contact_sheets":["/fixture/qa/contact-sheet-demo-video-full.jpg"],"summary":"stub"}'
fixture:
  expect: completed
  inputs:
    slug: demo-video
